<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración - Control de Baños</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
    h1, h2 { text-align: center; color: #1e7e34; }
    .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], input[type="file"], input[type="password"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { background: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; }
    button:hover { background: #218838; }
    .table-container { margin-top: 30px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
    th { background: #e9f5ed; color: #1e7e34; }
    .thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 50%; border: 1px solid #28a745; }

    /* DISEÑO DE CREDENCIAL EN DOS PÁGINAS (FRENTE Y VUELTA) */
    .credencial-pagina {
      width: 85.6mm;
      height: 54mm;
      background: #ffffff;
      color: #333;
      box-sizing: border-box;
      padding: 3mm;
      border: 1.5mm solid #28a745; /* Contorno Verde */
      border-radius: 3mm;
      font-family: Arial, sans-serif;
      position: relative;
      overflow: hidden;
    }

    /* FRENTE */
    .cred-header { text-align: center; font-size: 8pt; font-weight: bold; color: #28a745; border-bottom: 1px solid #28a745; padding-bottom: 1mm; margin-bottom: 2mm; }
    .cred-body-frente { display: flex; align-items: center; gap: 3mm; }
    .cred-foto { width: 22mm; height: 26mm; object-fit: cover; border-radius: 2mm; border: 1.5px solid #28a745; }
    .cred-info { flex: 1; font-size: 7.5pt; line-height: 1.3; }
    .cred-info strong { font-size: 8pt; color: #1e7e34; }

    /* VUELTA */
    .cred-body-vuelta { text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
    .cred-qr { width: 26mm; height: 26mm; border: 1px solid #28a745; padding: 1mm; border-radius: 1mm; }
    .cred-instrucciones { font-size: 6.5pt; color: #555; margin-top: 1.5mm; }

    .html2pdf__page-break { page-break-after: always; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

  <div class="container">
    <h1>Gestión de Locatarios</h1>
    
    <form id="registroForm">
      <div class="form-group">
        <label>Nombre del Locatario:</label>
        <input type="text" id="nombre" required>
      </div>
      <div class="form-group">
        <label>Número / Identificador de Local:</label>
        <input type="text" id="local" required>
      </div>
      <div class="form-group">
        <label>Identificación / INE:</label>
        <input type="text" id="identificacion" required>
      </div>
      <div class="form-group">
        <label>Mes Activo (ej. Septiembre 2026):</label>
        <input type="text" id="mes_activo" required>
      </div>
      <div class="form-group">
        <label>Fotografía:</label>
        <input type="file" id="foto" accept="image/*" required>
      </div>
      <div class="form-group">
        <label>Clave de Administrador:</label>
        <input type="password" id="clave" required>
      </div>
      <button type="submit">Registrar y Generar Credencial (2 Páginas)</button>
    </form>

    <div class="table-container">
      <h2>Locatarios Registrados</h2>
      <table>
        <thead>
          <tr>
            <th>Foto</th>
            <th>Nombre</th>
            <th>Local</th>
            <th>Mes Activo</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaLocatarios"></tbody>
      </table>
    </div>
  </div>

  <!-- PLANTILLA DE CREDENCIAL EN DOS PÁGINAS -->
  <div id="contenedor-oculto" style="position: absolute; left: -9999px; top: -9999px;">
    <div id="area-credencial">
      <!-- PÁGINA 1: FRENTE -->
      <div class="credencial-pagina">
        <div class="cred-header">CONTROL DE ACCESO A BAÑOS</div>
        <div class="cred-body-frente">
          <img id="cred-img-foto" class="cred-foto" src="" alt="Foto Locatario">
          <div class="cred-info">
            <div><strong id="cred-txt-nombre">---</strong></div>
            <div>Local: <span id="cred-txt-local">---</span></div>
            <div>ID: <span id="cred-txt-id">---</span></div>
            <div>Mes Activo: <span id="cred-txt-mes">---</span></div>
          </div>
        </div>
      </div>

      <div class="html2pdf__page-break"></div>

      <!-- PÁGINA 2: VUELTA -->
      <div class="credencial-pagina">
        <div class="cred-header">CÓDIGO DE VALIDACIÓN</div>
        <div class="cred-body-vuelta">
          <img id="cred-img-qr" class="cred-qr" src="" alt="Código QR">
          <div class="cred-instrucciones">Presente este código al oficial de seguridad para ingresar a las instalaciones.</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('registroForm');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const formData = new FormData();
      formData.append('nombre', document.getElementById('nombre').value);
      formData.append('local', document.getElementById('local').value);
      formData.append('identificacion', document.getElementById('identificacion').value);
      formData.append('mes_activo', document.getElementById('mes_activo').value);
      formData.append('clave', document.getElementById('clave').value);
      formData.append('foto', document.getElementById('foto').files[0]);

      try {
        const res = await fetch('/api/registrar', { method: 'POST', body: formData });
        const data = await res.json();

        if (data.success) {
          alert('¡Locatario registrado con éxito! Generando PDF de 2 páginas...');
          await descargarPDFCredencial(data.data);
          form.reset();
          cargarLocatarios();
        } else {
          alert('Error: ' + data.error);
        }
      } catch (err) {
        alert('Error al conectar con el servidor.');
      }
    });

    async function cargarLocatarios() {
      const res = await fetch('/api/locatarios');
      const data = await res.json();
      const tbody = document.getElementById('tablaLocatarios');
      tbody.innerHTML = '';

      data.forEach(item => {
        tbody.innerHTML += `
          <tr>
            <td><img src="${item.foto}" class="thumb" alt="Foto"></td>
            <td>${item.nombre}</td>
            <td>${item.local}</td>
            <td>${item.mes_activo}</td>
            <td>${item.activo === 1 ? '✅ Activo' : '❌ Inactivo'}</td>
            <td>
              <button onclick='reimprimirCredencial(${JSON.stringify(item)})' style="padding: 5px; font-size: 12px; background: #28a745;">Descargar PDF</button>
            </td>
          </tr>
        `;
      });
    }

    async function reimprimirCredencial(locatario) {
      const host = window.location.host;
      const protocol = window.location.protocol;
      const validacionUrl = `${protocol}//${host}/validar.html?token=${locatario.token}`;
      
      const qrImage = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(validacionUrl)}`;

      descargarPDFCredencial({
        nombre: locatario.nombre,
        local: locatario.local,
        identificacion: locatario.identificacion,
        mes_activo: locatario.mes_activo,
        foto: locatario.foto,
        qrImage: qrImage
      });
    }

    async function descargarPDFCredencial(datos) {
      document.getElementById('cred-txt-nombre').textContent = datos.nombre;
      document.getElementById('cred-txt-local').textContent = datos.local;
      document.getElementById('cred-txt-id').textContent = datos.identificacion;
      document.getElementById('cred-txt-mes').textContent = datos.mes_activo;

      document.getElementById('cred-img-foto').src = datos.foto;
      document.getElementById('cred-img-qr').src = datos.qrImage;

      const contenedor = document.getElementById('contenedor-oculto');
      contenedor.style.position = 'static';
      contenedor.style.left = '0';
      contenedor.style.top = '0';

      const elemento = document.getElementById('area-credencial');

      const opciones = {
        margin: 0,
        filename: `Credencial_${datos.nombre.replace(/\s+/g, '_')}.pdf`,
        image: { type: 'jpeg', quality: 1.0 },
        html2canvas: { scale: 3, useCORS: true, allowTaint: true },
        jsPDF: { unit: 'mm', format: [85.6, 54], orientation: 'landscape' }
      };

      await html2pdf().set(opciones).from(elemento).save();

      contenedor.style.position = 'absolute';
      contenedor.style.left = '-9999px';
      contenedor.style.top = '-9999px';
    }

    cargarLocatarios();
  </script>
</body>
</html>

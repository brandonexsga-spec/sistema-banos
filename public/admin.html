<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración - Control de Baños</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
    h1, h2 { text-align: center; color: #1e7e34; }
    .container { max-width: 950px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], input[type="file"], input[type="password"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { background: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; }
    button:hover { background: #218838; }
    
    .table-container { margin-top: 30px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; font-size: 14px; }
    th { background: #e9f5ed; color: #1e7e34; }
    .thumb { width: 45px; height: 45px; object-fit: cover; border-radius: 50%; border: 1px solid #28a745; display: block; margin: 0 auto; }

    /* BOTONES DE ACCIÓN */
    .btn-accion { padding: 5px 8px; font-size: 11px; margin: 2px; border-radius: 3px; border: none; cursor: pointer; font-weight: bold; color: white; }
    .btn-pdf { background: #28a745; }
    .btn-estado { background: #ffc107; color: #333; }
    .btn-borrar { background: #dc3545; }

    /* DISEÑO DE CREDENCIAL VERTICAL DE 1 SOLA CARA (54mm x 85.6mm) */
    #area-credencial {
      width: 54mm;
      height: 85.6mm;
      background: #ffffff;
      color: #333;
      box-sizing: border-box;
      padding: 3mm;
      border: 1.5mm solid #28a745; /* Contorno Verde */
      border-radius: 3mm;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
    }
    .cred-header { font-size: 7.5pt; font-weight: bold; color: #28a745; border-bottom: 1px solid #28a745; width: 100%; padding-bottom: 1mm; }
    .cred-foto { width: 22mm; height: 26mm; object-fit: cover; border-radius: 2mm; border: 1.5px solid #28a745; margin: 1mm 0; }
    .cred-info { font-size: 7pt; line-height: 1.2; width: 100%; }
    .cred-info strong { font-size: 7.5pt; color: #1e7e34; display: block; margin-bottom: 1px; }
    .cred-qr { width: 22mm; height: 22mm; border: 1px solid #28a745; padding: 0.5mm; border-radius: 1mm; }
    .cred-footer { font-size: 5.5pt; color: #666; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

  <div class="container">
    <h1>Gestión de Locatarios</h1>
    
    <form id="registroForm">
      <div class="form-group">
        <label>Nombre del Locatario:</label>
        <input type="text" id="nombre" required>
      </div>
      <div class="form-group">
        <label>Número / Identificador de Local:</label>
        <input type="text" id="local" required>
      </div>
      <div class="form-group">
        <label>Identificación / INE:</label>
        <input type="text" id="identificacion" required>
      </div>
      <div class="form-group">
        <label>Mes Activo (ej. Septiembre 2026):</label>
        <input type="text" id="mes_activo" required>
      </div>
      <div class="form-group">
        <label>Fotografía:</label>
        <input type="file" id="foto" accept="image/*" required>
      </div>
      <div class="form-group">
        <label>Clave de Administrador:</label>
        <input type="password" id="clave" required>
      </div>
      <button type="submit">Registrar y Generar Credencial Vertical</button>
    </form>

    <div class="table-container">
      <h2>Locatarios Registrados</h2>
      <table>
        <thead>
          <tr>
            <th>Foto</th>
            <th>Nombre</th>
            <th>Local</th>
            <th>Mes Activo</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaLocatarios"></tbody>
      </table>
    </div>
  </div>

  <!-- PLANTILLA OCULTA DE CREDENCIAL VERTICAL (1 SOLA CARA) -->
  <div id="contenedor-oculto" style="position: absolute; left: -9999px; top: -9999px;">
    <div id="area-credencial">
      <div class="cred-header">CONTROL DE ACCESO A BAÑOS</div>
      <img id="cred-img-foto" class="cred-foto" src="" alt="Foto">
      <div class="cred-info">
        <strong id="cred-txt-nombre">---</strong>
        <div>Local: <span id="cred-txt-local">---</span></div>
        <div>ID: <span id="cred-txt-id">---</span></div>
        <div>Mes: <span id="cred-txt-mes">---</span></div>
      </div>
      <img id="cred-img-qr" class="cred-qr" src="" alt="QR">
      <div class="cred-footer">Validez sujeta a estado del mes activo</div>
    </div>
  </div>

  <script>
    const form = document.getElementById('registroForm');

    // CONVERSIÓN DIRECTA A BASE64 PARA EVITAR BLOQUEOS DE CORS E IMÁGENES INVISIBLES
    async function obtenerFotoBase64(url) {
      if (!url) return '';
      try {
        const res = await fetch(url, { mode: 'cors' });
        const blob = await res.blob();
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(reader.result);
          reader.readAsDataURL(blob);
        });
      } catch (e) {
        console.error("Error al convertir foto:", e);
        return url; // Retorno de respaldo
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const formData = new FormData();
      formData.append('nombre', document.getElementById('nombre').value);
      formData.append('local', document.getElementById('local').value);
      formData.append('identificacion', document.getElementById('identificacion').value);
      formData.append('mes_activo', document.getElementById('mes_activo').value);
      formData.append('clave', document.getElementById('clave').value);
      formData.append('foto', document.getElementById('foto').files[0]);

      try {
        const res = await fetch('/api/registrar', { method: 'POST', body: formData });
        const data = await res.json();

        if (data.success) {
          alert('¡Locatario registrado con éxito! Generando PDF...');
          await descargarPDFCredencial(data.data);
          form.reset();
          cargarLocatarios();
        } else {
          alert('Error: ' + data.error);
        }
      } catch (err) {
        alert('Error al conectar con el servidor.');
      }
    });

    async function cargarLocatarios() {
      const res = await fetch('/api/locatarios');
      const data = await res.json();
      const tbody = document.getElementById('tablaLocatarios');
      tbody.innerHTML = '';

      for (const item of data) {
        const fotoBase64 = await obtenerFotoBase64(item.foto);

        tbody.innerHTML += `
          <tr>
            <td><img src="${fotoBase64}" class="thumb" alt="Foto"></td>
            <td>${item.nombre}</td>
            <td>${item.local}</td>
            <td>${item.mes_activo}</td>
            <td>${item.activo === 1 ? '✅ Activo' : '❌ Inactivo'}</td>
            <td>
              <button class="btn-accion btn-pdf" onclick='reimprimirCredencial(${JSON.stringify(item)})'>PDF</button>
              <button class="btn-accion btn-estado" onclick='cambiarEstado(${item.id}, "${item.mes_activo}", ${item.activo})'>
                ${item.activo === 1 ? 'Bloquear' : 'Activar'}
              </button>
              <button class="btn-accion btn-borrar" onclick='borrarLocatario(${item.id})'>Borrar</button>
            </td>
          </tr>
        `;
      }
    }

    // ACCIÓN: BLOQUEAR O RENOVAR MES
    async function cambiarEstado(id, mesActual, estadoActual) {
      const clave = prompt('Ingresa la Clave de Administrador:');
      if (!clave) return;

      const nuevoEstado = estadoActual === 1 ? 0 : 1;
      const nuevoMes = nuevoEstado === 1 ? prompt('Ingresa el nuevo Mes Activo:', mesActual) : mesActual;

      const res = await fetch('/api/renovar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, mes_activo: nuevoMes || mesActual, activo: nuevoEstado, clave })
      });

      const data = await res.json();
      if (data.success) {
        alert('Estado del locatario actualizado correctamente.');
        cargarLocatarios();
      } else {
        alert('Error: ' + data.error);
      }
    }

    // ACCIÓN: ELIMINAR LOCATARIO
    async function borrarLocatario(id) {
      const clave = prompt('Ingresa la Clave de Administrador para eliminar el registro:');
      if (!clave) return;

      if (!confirm('¿Estás seguro de borrar a este locatario de forma definitiva?')) return;

      const res = await fetch(`/api/locatarios/${id}`, {
        method: 'DELETE',
        headers: { 'x-admin-key': clave }
      });

      const data = await res.json();
      if (data.success) {
        alert('Registro eliminado con éxito.');
        cargarLocatarios();
      } else {
        alert('Error: ' + data.error);
      }
    }

    async function reimprimirCredencial(locatario) {
      const host = window.location.host;
      const protocol = window.location.protocol;
      const validacionUrl = `${protocol}//${host}/validar.html?token=${locatario.token}`;
      
      const qrImage = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(validacionUrl)}`;

      descargarPDFCredencial({
        nombre: locatario.nombre,
        local: locatario.local,
        identificacion: locatario.identificacion,
        mes_activo: locatario.mes_activo,
        foto: locatario.foto,
        qrImage: qrImage
      });
    }

    async function descargarPDFCredencial(datos) {
      document.getElementById('cred-txt-nombre').textContent = datos.nombre;
      document.getElementById('cred-txt-local').textContent = datos.local;
      document.getElementById('cred-txt-id').textContent = datos.identificacion;
      document.getElementById('cred-txt-mes').textContent = datos.mes_activo;

      const fotoBase64 = await obtenerFotoBase64(datos.foto);
      document.getElementById('cred-img-foto').src = fotoBase64;
      document.getElementById('cred-img-qr').src = datos.qrImage;

      const contenedor = document.getElementById('contenedor-oculto');
      contenedor.style.position = 'static';
      contenedor.style.left = '0';
      contenedor.style.top = '0';

      const elemento = document.getElementById('area-credencial');

      const opciones = {
        margin: 0,
        filename: `Credencial_${datos.nombre.replace(/\s+/g, '_')}.pdf`,
        image: { type: 'jpeg', quality: 1.0 },
        html2canvas: { scale: 3, useCORS: true, allowTaint: true },
        jsPDF: { unit: 'mm', format: [54, 85.6], orientation: 'portrait' } // Formato Vertical (CR80)
      };

      await html2pdf().set(opciones).from(elemento).save();

      contenedor.style.position = 'absolute';
      contenedor.style.left = '-9999px';
      contenedor.style.top = '-9999px';
    }

    cargarLocatarios();
  </script>
</body>
</html>
